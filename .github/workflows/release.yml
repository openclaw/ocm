name: Release
run-name: Release ${{ inputs.tag }}

# macOS signing and notarization prerequisites: docs/RELEASING.md

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release tag
    if: github.repository == 'openclaw/ocm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      # Build and publish consume only the signed tag target validated below.
      # Dispatch inputs never select executable release source.
      source: ${{ steps.verify.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed tag and package version
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          verified_commit="$(
            ./scripts/verify-release-tag.sh \
              --repo "$RELEASE_REPO" \
              --tag "$RELEASE_TAG"
          )"
          ./scripts/verify-release-ci.sh \
            --repo "$RELEASE_REPO" \
            --commit "$verified_commit"
          printf 'source=%s\n' "$verified_commit" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            macos: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            macos: true
          - os: macos-14
            target: aarch64-apple-darwin
            macos: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Import Developer ID certificate
        if: ${{ matrix.macos }}
        uses: Apple-Actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
      - name: Sign and notarize macOS executable
        id: sign-macos
        if: ${{ matrix.macos }}
        env:
          OCM_MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          OCM_NOTARY_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          OCM_NOTARY_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          OCM_NOTARY_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          python3 - "${{ matrix.target }}" <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import sys
          import tempfile

          binary = Path("target") / sys.argv[1] / "release/ocm"
          submission = None
          with subprocess.Popen(
              ["./scripts/sign-notarize-macos.sh", "--binary", str(binary)],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
          ) as signing:
              for line in signing.stdout:
                  print(line, end="", flush=True)
                  match = re.fullmatch(
                      r"Apple notarization accepted submission ([0-9a-f-]{36})\n?", line
                  )
                  if match and re.fullmatch(
                      r"[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}", match[1]
                  ):
                      submission = match[1]
              status = signing.wait()
          if status == 0:
              sys.exit(0)
          status = status if status > 0 else 128 - status

          # Diagnostics are advisory: bound tool output/time and never print raw errors.
          def capture(command, stderr=subprocess.DEVNULL):
              with tempfile.TemporaryFile() as output:
                  result = subprocess.run(command, stdout=output, stderr=stderr, timeout=15)
                  output.seek(0)
                  data = output.read(65537)
              if result.returncode or len(data) > 65536:
                  raise ValueError("diagnostic unavailable")
              return data.decode("utf-8")

          def interrupted(signum, frame):
              raise SystemExit(1)

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)
          try:
              if binary.is_file() and not binary.is_symlink():
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write("diagnostic_binary=true\n")
              try:
                  metadata = capture(["codesign", "-d", "--verbose=4", str(binary)], subprocess.STDOUT)
                  fields = {}
                  for line in metadata.splitlines():
                      if re.fullmatch(
                          r"CDHash=[0-9a-fA-F]{40}|Identifier=com\.openclaw\.ocm|"
                          r"TeamIdentifier=[A-Z0-9]{10}|Format=Mach-O thin \((?:x86_64|arm64)\)", line
                      ):
                          fields[line.split("=", 1)[0]] = line
                  for line in fields.values():
                      print("Signing diagnostic: " + line)
              except (OSError, ValueError, subprocess.TimeoutExpired):
                  print("Signing metadata diagnostic unavailable")
              try:
                  entries = json.loads(capture([
                      "/usr/bin/log", "show", "--last", "2m", "--style", "json", "--predicate",
                      'process == "codesign" AND subsystem == "com.apple.securityd" '
                      'AND eventMessage CONTAINS "Error checking with notarization daemon:"',
                  ]))
                  errors = []
                  if not isinstance(entries, list):
                      raise ValueError("invalid log")
                  for entry in entries:
                      message = entry.get("eventMessage") if isinstance(entry, dict) else None
                      match = re.fullmatch(r"Error checking with notarization daemon: (-?\d{1,10})", message.strip()) if isinstance(message, str) else None
                      if match:
                          errors.append(int(match[1]))
                  print("Recent codesign notarization daemon error codes (host, last 2m):", errors[:20])
              except (OSError, ValueError, subprocess.TimeoutExpired):
                  print("Notarization daemon diagnostic unavailable")
              if submission:
                  try:
                      with tempfile.TemporaryDirectory(prefix="ocm-notary-log-", dir=os.environ["RUNNER_TEMP"]) as directory:
                          key = Path(directory) / "AuthKey.p8"
                          with os.fdopen(os.open(key, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), "w") as output:
                              output.write(os.environ["OCM_NOTARY_API_PRIVATE_KEY"])
                          report = json.loads(capture([
                              "xcrun", "notarytool", "log", submission, "--key", str(key),
                              "--key-id", os.environ["OCM_NOTARY_API_KEY_ID"],
                              "--issuer", os.environ["OCM_NOTARY_ISSUER_ID"],
                          ]))
                      if not isinstance(report, dict):
                          raise ValueError("invalid notary log")
                      summary = {"submission": submission}
                      if report.get("status") in ("Accepted", "Invalid", "Rejected", "In Progress"):
                          summary["status"] = report["status"]
                      if type(report.get("statusCode")) is int and 0 <= report["statusCode"] <= 999999:
                          summary["statusCode"] = report["statusCode"]
                      if report.get("issues") is None or isinstance(report.get("issues"), list):
                          summary["issueCount"] = len(report.get("issues") or [])
                      tickets = report.get("ticketContents")
                      summary["tickets"] = [
                          {"cdhash": item["cdhash"], "arch": item["arch"], "path": item["path"]}
                          for item in tickets if isinstance(item, dict)
                          and isinstance(item.get("cdhash"), str) and re.fullmatch(r"[0-9a-fA-F]{40}", item["cdhash"])
                          and item.get("arch") in ("x86_64", "arm64") and item.get("path") == "ocm.zip/ocm"
                      ][:8] if isinstance(tickets, list) else []
                      print("Apple notary log diagnostic: " + json.dumps(summary, sort_keys=True))
                  except (KeyError, OSError, ValueError, subprocess.TimeoutExpired):
                      print("Apple notary log diagnostic unavailable")
          except (KeyError, OSError):
              print("Signing diagnostics unavailable")
          finally:
              sys.exit(status)
          PYTHON
      - name: Retain failed macOS executable for diagnosis
        if: ${{ failure() && steps.sign-macos.outputs.diagnostic_binary == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarization-diagnostic-${{ matrix.target }}-${{ github.run_attempt }}
          path: ./target/${{ matrix.target }}/release/ocm
          if-no-files-found: warn
          retention-days: 1
      - name: Package macOS release archive
        if: ${{ matrix.macos }}
        env:
          OCM_MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          ./scripts/package-release.sh \
            --target "${{ matrix.target }}" \
            --binary "./target/${{ matrix.target }}/release/ocm" \
            --macos-team-id "$OCM_MACOS_TEAM_ID" \
            --output-dir ./dist
      - name: Package Linux release archive
        if: ${{ !matrix.macos }}
        run: |
          ./scripts/package-release.sh \
            --target "${{ matrix.target }}" \
            --binary "./target/${{ matrix.target }}/release/ocm" \
            --output-dir ./dist
      - name: Stage release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ./dist/ocm-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish complete release
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source }}
          path: release-source
          persist-credentials: false
      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ./dist
          merge-multiple: true
      - name: Stage versioned installer
        run: cp ./release-source/install.sh ./dist/install.sh
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.source }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./trusted/scripts/publish-release.sh \
            --repo "$RELEASE_REPO" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --asset-dir ./dist
