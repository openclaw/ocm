name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release tag
    if: github.repository == 'openclaw/ocm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      # Build and publish consume only the signed tag target validated below.
      # Dispatch inputs never select executable release source.
      source: ${{ steps.verify.outputs.source }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed tag and package version
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          verified_commit="$(
            ./scripts/verify-release-tag.sh \
              --repo "$RELEASE_REPO" \
              --tag "$RELEASE_TAG"
          )"
          ./scripts/verify-release-ci.sh \
            --repo "$RELEASE_REPO" \
            --commit "$verified_commit"
          printf 'source=%s\n' "$verified_commit" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify.outputs.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package release archive
        run: |
          ./scripts/package-release.sh \
            --target "${{ matrix.target }}" \
            --binary "./target/${{ matrix.target }}/release/ocm" \
            --output-dir ./dist
      - name: Stage release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ./dist/ocm-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish complete release
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify.outputs.source }}
          path: release-source
          persist-credentials: false
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: ./dist
          merge-multiple: true
      - name: Stage versioned installer
        run: cp ./release-source/install.sh ./dist/install.sh
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.source }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./trusted/scripts/publish-release.sh \
            --repo "$RELEASE_REPO" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --asset-dir ./dist
