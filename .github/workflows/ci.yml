name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --check
      - name: Test automatic release policy and production boundaries
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_auto_release*.py'

  msrv:
    name: Rust 1.88 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check minimum supported Rust version
        run: cargo check --workspace --all-targets --locked

  windows:
    name: Windows compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check Windows targets
        run: cargo check --workspace --all-targets --locked
      - name: Prove Windows configuration include guards
        timeout-minutes: 5
        run: cargo test --locked --lib store::config_include_read::tests -- --nocapture
      - name: Prove Windows managed Node ZIP install and offline reuse
        timeout-minutes: 5
        run: cargo test --locked --lib managed_node::tests::windows_managed_node_zip_installs_and_reuses_offline -- --ignored --exact --nocapture
      - name: Prove missing Unicode environment root isolation
        timeout-minutes: 5
        run: cargo test --locked --test env_root_isolation_tests missing_unicode_
      - name: Prove imported state path relocation
        timeout-minutes: 5
        run: cargo test --locked --test env_export_plugin_path_tests state_import_relocates_plugin_receipts_and_runtime_references_only -- --exact
      - name: Prove imported Git ownership
        timeout-minutes: 5
        run: cargo test --locked --test env_import_tests -- --nocapture
      - name: Prove local and network file URL relocation
        timeout-minutes: 5
        run: cargo test --locked --lib store::openclaw_state::tests::file_url_relocation_changes_windows_authority -- --exact
      - name: Prove Windows root prefix representations
        timeout-minutes: 5
        run: cargo test --locked --lib archive_root_prefix_matches_windows_representations -- --nocapture
      - name: Prove configured Windows path admission and cleanup
        timeout-minutes: 5
        run: cargo test --locked --lib root_spellings -- --nocapture
      - name: Prove Windows migration admission under root spellings
        timeout-minutes: 5
        run: cargo test --locked --test migrate_command_tests migration_preserves_internal_redirect_refusal_under_root_spellings -- --exact --nocapture
      - name: Prove Windows migration session projections
        timeout-minutes: 5
        run: cargo test --locked --test migrate_command_tests migration_rebases_ -- --nocapture
      - name: Prove Windows clone admission under root spellings
        timeout-minutes: 5
        run: cargo test --locked --test env_clone_tests env_clone_rejects_internal_workspace_links_under_root_spellings -- --exact --nocapture
      - name: Prove Windows cleanup preserves credentials and collision precedence
        timeout-minutes: 5
        run: cargo test --locked --test env_cleanup_tests root_spellings -- --nocapture
      - name: Prove copied Git configuration ownership
        timeout-minutes: 5
        run: cargo test --locked --test env_clone_tests env_clone_copied_git_config_ -- --nocapture
      - name: Prove copied Git configuration ordering
        timeout-minutes: 5
        run: cargo test --locked --lib store::openclaw_state::git_config::tests
      - name: Prove private config writes
        run: cargo test --locked --lib private_config_
      - name: Prove private Windows UI handoffs
        run: cargo test --locked --lib dev_handoff -- --nocapture
      - name: Prove canonical owned worktree paths
        run: cargo test --locked --lib openclaw_repo::tests::owned_worktree_uses_canonical_repository_paths -- --exact --nocapture
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Prove native Windows stage command ownership
        timeout-minutes: 5
        run: |
          cargo test --locked --lib windows_stage_command::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib windows_runtime_stage::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove native Windows runtime tree hashing
        timeout-minutes: 5
        run: cargo test --locked --test runtime_command_tests runtime_build_local_with_native_npm_preserves_tree_integrity -- --exact --nocapture
      - name: Capture isolated R11 cleanup call and spelling diagnostic
        if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 751
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $area = Join-Path $env:RUNNER_TEMP ('r11-diag-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          New-Item -ItemType Directory -Path $area | Out-Null
          $source = Join-Path $area 'source'
          git fetch --depth=1 origin 7228ef7d30eeba90678c8589af3f458b8b0fafc6
          if ($LASTEXITCODE -ne 0) { throw 'R11 diagnostic source fetch failed' }
          git worktree add --detach $source 7228ef7d30eeba90678c8589af3f458b8b0fafc6
          if ($LASTEXITCODE -ne 0) { throw 'R11 diagnostic checkout failed' }
          $patch = Join-Path $area 'cleanup-cause.patch'
          [IO.File]::WriteAllBytes($patch, [Convert]::FromBase64String(''))
          if ((Get-FileHash $patch -Algorithm SHA256).Hash -ne 'adb8b3c7d48add3e3efb2a546e14396eddf4b5aa88a5c8d4d8543a4f062b78b8') {
            throw 'R11 diagnostic patch checksum mismatch'
          }
          $previousTarget = $env:CARGO_TARGET_DIR
          Push-Location $source
          try {
            $env:CARGO_TARGET_DIR = Join-Path $area 'target'
            git rev-parse HEAD 'HEAD^{tree}'
            if ((git rev-parse 'HEAD^{tree}') -ne 'a65bf6bf93cb53067b31150ed2df9ae28a0d80d5') { throw 'R11 product tree mismatch' }
            node --version
            npm --version
            if ((node --version) -ne 'v22.23.4' -or (npm --version) -ne '10.9.9') { throw 'R11 diagnostic tool version mismatch' }
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) { throw 'R11 diagnostic patch does not apply' }
            git apply $patch
            if ($LASTEXITCODE -ne 0) { throw 'R11 diagnostic patch failed' }
            git add -- tests/windows_runtime_publication_tests.rs
            git diff --cached --stat
            git write-tree
            Get-FileHash tests/windows_runtime_publication_tests.rs -Algorithm SHA256
            cargo build --locked
            if ($LASTEXITCODE -ne 0) { throw 'R11 diagnostic product build failed' }
            Get-FileHash (Join-Path $env:CARGO_TARGET_DIR 'debug/ocm.exe') -Algorithm SHA256
            . ./tests/support/windows_without_symlinks.ps1
            Invoke-WithoutDeveloperSymlinks {
              cargo test --locked --test windows_runtime_publication_tests native_windows_in_place_upgrade_validates_retained_linked_bytes_and_rolls_back -- --exact --nocapture
              $captureExit = $LASTEXITCODE
              Get-FileHash (Join-Path $env:CARGO_TARGET_DIR 'debug/ocm.exe') -Algorithm SHA256
              Write-Output "R11 isolated explicit rollback diagnostic exit=$captureExit"
              if ($captureExit -ne 0) { throw 'R11 explicit rollback diagnostic retained its failure' }
            }
          } finally {
            $env:CARGO_TARGET_DIR = $previousTarget
            Pop-Location
          }
      - name: Prove native Windows companion dependency bindings
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tests/support/windows_without_symlinks.ps1
          Invoke-WithoutDeveloperSymlinks {
            cargo test --locked --lib junction -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'native runtime junction lifecycle failed' }
            cargo test --locked --test windows_companion_bindings_tests native_windows_companion_without_symlink_privilege -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'native companion regression failed' }
          }
      - name: Prove native Windows installed runtime launch
        timeout-minutes: 5
        shell: pwsh
        run: |
          cargo test --locked --test runtime_launch_tests -- --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'native launch regression failed' }
      - name: Prove native Windows dev stop lifecycle
        run: |
          cargo test --locked --lib windows_source_watch_ -- --nocapture
          cargo test --locked --test windows_dev_stop_tests native_windows_dev_stop_lifecycle -- --exact --nocapture
      - name: Prove native Windows runtime installation prefixes
        timeout-minutes: 5
        run: cargo test --locked --lib store::runtimes::tests::native_npm_prefix_accepts_windows_paths -- --exact --nocapture
      - name: Prove native Windows runtime packing custody
        timeout-minutes: 5
        run: |
          cargo test --locked --test windows_runtime_pack_tests native_windows_pack_preserves_live_child_archive -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 568
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 568
        with:
          ref: 223395b59718f2c32565a8eac83a879355158508
          path: base
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 568
        with:
          node-version: '22.15.0'
          package-manager-cache: false
      - name: Record previous runtime
        if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 568
        shell: pwsh
        run: '"PAIR_OLD_NODE=$((Get-Command node).Source)" >> $env:GITHUB_ENV'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 568
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Record patched runtime and runner resources
        if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 568
        shell: pwsh
        run: |
          "PAIR_NEW_NODE=$((Get-Command node).Source)" >> $env:GITHUB_ENV
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory,NumberOfLogicalProcessors | ConvertTo-Json
          Get-PSDrive C | Select-Object Used,Free | ConvertTo-Json
      - name: Compare pinned revisions and runtimes serially
        timeout-minutes: 80
        if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 568
        shell: pwsh
        run: python candidate/scripts/validate-runtime-pair.py candidate base "$env:RUNNER_TEMP/runtime-regression-pair"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 568
        with:
          name: runtime-regression-pair
          path: ${{ runner.temp }}/runtime-regression-pair
          if-no-files-found: error
          retention-days: 7

  test:
    # Keep required check names stable when runner labels change.
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: ubuntu-latest }
          - { os: xcode-27, name: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install fish for the executed fish helper test
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fish
          else
            brew install fish
          fi
          fish --version
      - name: Prove macOS private config creation across users
        if: runner.os == 'macOS'
        run: |
          private_config_test_binary=$(cargo test --locked --lib --no-run --message-format=json | python3 -c 'import json,sys; paths=[entry["executable"] for line in sys.stdin if (entry:=json.loads(line)).get("reason")=="compiler-artifact" and entry.get("profile",{}).get("test") and entry.get("executable")]; assert len(paths)==1,paths; print(paths[0])')
          sudo -n -- "$private_config_test_binary" --ignored --exact store::openclaw_config::macos_privacy_tests::private_config_creation_excludes_other_users --nocapture
      - name: Build upgrade candidate (finite PR568 validation)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 568 && runner.os == 'Linux'
        run: cargo install --locked --path . --root "$RUNNER_TEMP/ocm-install"
      - name: Prove real released-predecessor service upgrade (finite PR568 validation)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 568 && runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          proof="$RUNNER_TEMP/ocm-released-upgrade"
          prefix="/opt/ocm-pr568-$GITHUB_RUN_ID"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 "$prefix"
          python3 scripts/validate-released-upgrade.py prepare --prefix "$prefix" --output "$proof" --candidate "$RUNNER_TEMP/ocm-install/bin/ocm"
          cargo install --locked --path . --root "$prefix" --force
          python3 scripts/validate-released-upgrade.py verify --prefix "$prefix" --output "$proof"
      - name: Release owned upgrade service and user
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 568 && runner.os == 'Linux'
        run: python3 scripts/validate-released-upgrade.py cleanup --prefix "/opt/ocm-pr568-$GITHUB_RUN_ID" --output "$RUNNER_TEMP/ocm-released-upgrade"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 568 && runner.os == 'Linux'
        with:
          name: released-predecessor-upgrade
          path: |
            ${{ runner.temp }}/ocm-released-upgrade/*.json
            ${{ runner.temp }}/ocm-released-upgrade/*.log
          if-no-files-found: error
          retention-days: 7

      - name: Run test suite
        run: cargo test --locked
      - name: Smoke test cargo install
        run: |
          cargo install --locked --path . --root "$RUNNER_TEMP/ocm-install"
          "$RUNNER_TEMP/ocm-install/bin/ocm" --version


  npm:
    name: npm (${{ matrix.name }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: ubuntu-latest, arch: x64, node: '22.23.4', prefix: '' }
          - { os: ubuntu-latest, name: ubuntu-latest, arch: x64, node: '24.22.1', prefix: '' }
          - { os: xcode-27, name: xcode-27-x86_64, arch: x64, node: '24.22.1', prefix: 'arch -x86_64' }
          - { os: xcode-27, name: xcode-27-arm64, arch: arm64, node: '24.22.1', prefix: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure Rosetta for Intel validation
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: |
          arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - run: ${{ matrix.prefix }} npm install --global --ignore-scripts npm@11.19.1
      - name: Test npm packaging, recovery, launcher, and isolated installation lifecycle
        run: ${{ matrix.prefix }} python3 -B -m unittest discover -s scripts/tests -p 'test_npm_*.py'
      # Temporary workaround for actions/runner-images#14924 on disposable macOS VMs.
      # Remove after the runner fix is qualified with the unchanged strict fixture.
      - name: Use TCP fallback for macOS notarization lookups
        if: runner.os == 'macOS'
        run: |
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E
      - name: Prove signed native byte preservation through npm
        if: matrix.node == '24.22.1'
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: ${{ matrix.prefix }} python3 -B scripts/tests/test_npm_install.py --published-binary-fixture
